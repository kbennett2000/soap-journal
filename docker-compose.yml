# Single-service Compose file for soap-journal. SQLite + Bible JSON live on
# the host under ./data; that is the only thing users need to back up.
services:
  soap-journal:
    build: .
    image: soap-journal:local
    container_name: soap-journal
    restart: unless-stopped
    # Host-side port is configurable from .env without rebuilding. Inside the
    # container we always bind 8080; the host-side default is 8045.
    ports:
      - "${PORT:-8045}:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
    # Health check uses Python instead of curl so we don't have to install
    # curl into the runtime image just for liveness probing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
