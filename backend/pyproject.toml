[project]
name = "soap-journal-backend"
version = "0.1.0"
description = "soap-journal backend — FastAPI app for SOAP-method Bible journaling."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["soap_journal"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC",
]
# B008: function call in argument defaults. FastAPI's Depends/Query/Body
# are explicitly designed to live there; the rule generates pure noise
# in a FastAPI codebase.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["soap_journal"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# The default run excludes `slow` tests (real full-PDF parses) so the unit
# suite stays fast (<10s per CLAUDE.md). Run the full set with
# `pytest -m "slow or not slow"`, or just the slow ones with `pytest -m slow`.
addopts = ["-m", "not slow", "--strict-markers"]
markers = [
    "slow: real-PDF-parse / full-source integration tests; excluded from the default run",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:passlib.*",
]
