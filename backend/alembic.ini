[alembic]
script_location = alembic

# The sqlalchemy.url is resolved at runtime from soap_journal.config in env.py.
# Do not hardcode database connection strings here.
sqlalchemy.url =

prepend_sys_path = .
version_path_separator = os
timezone =
truncate_slug_length = 40
revision_environment = false
sourceless = false


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
